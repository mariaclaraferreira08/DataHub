{% extends "catalogo/base.html" %}

{% block conteudo %}

<h1>Excluir categoria</h1>

<p>
    Tem certeza de que deseja excluir
    <strong>{{ categoria.nome }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button
        class="botao perigo"
        type="submit"
    >
        Excluir
    </button>

</form>

<br>

<a href="{% url 'categoria_lista' %}">
    Cancelar
</a>

{% endblock %}
