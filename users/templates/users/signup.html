
{% extends "catalogo/base.html" %}

{% block titulo %}Criar conta | DataHub{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

        <div class="card data-card p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="page-title">Criar sua conta</h2>

                <p class="text-muted">
                    Cadastre-se para começar a organizar seus datasets.
                </p>

            </div>

            <form action="" method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label for="username" class="form-label">
                        Nome de usuário
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Escolha um nome de usuário"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="fname" class="form-label">
                            Nome
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="fname"
                            name="fname"
                            placeholder="Seu nome"
                            autocomplete="given-name"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="lname" class="form-label">
                            Sobrenome
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="lname"
                            name="lname"
                            placeholder="Seu sobrenome"
                            autocomplete="family-name"
                            required
                        >

                    </div>

                </div>

                <div class="mb-3">

                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label for="pass1" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="pass1"
                        name="pass1"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label for="pass2" class="form-label">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="pass2"
                        name="pass2"
                        placeholder="Digite sua senha novamente"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button type="submit" class="btn btn-dark w-100 py-2">
                    Criar conta
                </button>

            </form>

            <div class="text-center mt-4">

                <p class="text-muted mb-0">
                    Já possui uma conta?

                    <a href="/signin/" class="text-decoration-none fw-semibold">
                        Entrar
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
