{% extends "catalogo/base.html" %}

{% block titulo %}Entrar | DataHub{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-5">

        <div class="card data-card p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="page-title">Bem-vindo de volta!</h2>

                <p class="text-muted">
                    Entre na sua conta para acessar seus datasets.
                </p>

            </div>

            <form action="" method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label for="username" class="form-label">
                        Nome de usuário
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Digite seu nome de usuário"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label for="pass1" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="pass1"
                        name="pass1"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit" class="btn btn-dark w-100 py-2">
                    Entrar
                </button>

            </form>

            <div class="text-center mt-4">

                <p class="text-muted mb-0">
                    Ainda não possui uma conta?

                    <a href="/signup/" class="text-decoration-none fw-semibold">
                        Cadastre-se
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
